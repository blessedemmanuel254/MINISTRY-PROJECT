<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3-dot Options (Ellipsis) — HTML + CSS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f3f4f6;
    }

    .card {
      width: 320px;
      padding: 20px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 6px 20px rgba(17, 24, 39, 0.08);
    }

    .menu-toggle {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .ellipsis-btn {
      --size: 36px;
      width: var(--size);
      height: var(--size);
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      position: relative;
      outline: none;
      transition: background 0.15s ease;
    }

    .ellipsis-btn:focus-visible {
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .ellipsis-btn:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    /* Perfectly round small dots */
    .ellipsis-btn .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #111;
      display: block;
      margin: 2px 0;
    }

    .ellipsis-vertical {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .menu-wrap {
      position: relative;
      display: inline-block;
    }

    .menu {
      position: absolute;
      right: 0;
      top: calc(100% + 10px);
      min-width: 160px;
      padding: 6px;
      border-radius: 8px;
      background: white;
      box-shadow: 0 6px 18px rgba(2, 6, 23, 0.12);
      opacity: 0;
      transform: translateY(-6px) scale(0.98);
      transform-origin: top right;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .menu-toggle:checked + .ellipsis-btn + .menu,
    .menu-wrap:focus-within .menu {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .menu a {
      display: block;
      padding: 10px 12px;
      border-radius: 6px;
      text-decoration: none;
      color: #0f172a;
      font-size: 14px;
    }

    .menu a:hover,
    .menu a:focus {
      background: rgba(2, 6, 23, 0.04);
      outline: none;
    }

    .divider {
      height: 1px;
      background: rgba(2, 6, 23, 0.06);
      margin: 6px 0;
      border-radius: 1px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-weight: 600;
      color: #0f172a;
    }

    .description {
      font-size: 13px;
      color: #475569;
      margin-top: 12px;
    }

    .menu a {
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <div class="card" aria-label="card with options">
    <div class="header">
      <div>
        <div class="title">Item title</div>
        <div class="description">Small description text below the title.</div>
      </div>

      <div class="menu-wrap">
        <input id="menuToggle1" class="menu-toggle" type="checkbox" aria-hidden="true" />
        <label class="ellipsis-btn" for="menuToggle1" tabindex="0" aria-haspopup="true" aria-controls="menu1" aria-expanded="false" onkeydown="if(event.key==='Escape'){document.getElementById('menuToggle1').checked=false}">
          <span class="ellipsis-vertical" aria-hidden="true">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </span>
        </label>

        <nav id="menu1" class="menu" role="menu" aria-label="Options">
          <a href="#" role="menuitem" tabindex="0">Edit</a>
          <a href="#" role="menuitem" tabindex="0">Share</a>
          <div class="divider" aria-hidden="true"></div>
          <a href="#" role="menuitem" tabindex="0">Delete</a>
        </nav>
      </div>
    </div>
  </div>
</body>
</html>
